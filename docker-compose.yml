services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  superset:
    image: apache/superset:latest
    container_name: superset
    # The default non-root user can't write into /app/pythonpath (where
    # psycopg2-binary needs to land, see the command below — its own
    # site-packages dir isn't writable either). Running as root is a
    # deliberate local-dev tradeoff; revisit if/when this moves toward the
    # restricted-delivery phase (see project notes on that).
    user: root
    depends_on:
      - postgres
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Superset's OWN metadata (dashboards/charts/datasets/users) — its own
      # database, not ${POSTGRES_DB} (inep, the warehouse). See
      # superset_config.py and ensure_superset_db.py.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset
    volumes:
      # /app/pythonpath is on the official image's PYTHONPATH, so Superset
      # auto-imports superset_config.py as a module on startup.
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      - ./superset/ensure_superset_db.py:/app/pythonpath/ensure_superset_db.py
    # The base image ships with no Postgres driver at all (psycopg2 isn't
    # importable), so neither Superset's own metadata store nor any
    # Postgres connection made through the UI (e.g. to "inep") worked
    # before this. Installed on every start, matching the same pattern
    # already used by the airflow-* services. --target=/app/pythonpath
    # because that's the one directory confirmed to be on the actual
    # runtime venv's sys.path — the venv itself has no pip inside it, and
    # its own site-packages isn't on PYTHONPATH the way /app/pythonpath is.
    command: >
      /bin/sh -c "pip install --no-cache-dir --target=/app/pythonpath psycopg2-binary &&
      python3 /app/pythonpath/ensure_superset_db.py &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password admin &&
      superset init &&
      /usr/bin/run-server.sh"
    restart: unless-stopped

  jupyter:
    image: jupyter/base-notebook:python-3.11
    container_name: jupyter_lab
    working_dir: /home/jovyan/work
    volumes:
      - .:/home/jovyan/work
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    command: >
      start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
    depends_on:
      - postgres
    restart: unless-stopped

  python:
    image: python:3.11-slim
    container_name: python_env
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      sh -c "pip install --no-cache-dir pandas sqlalchemy psycopg2-binary apache-airflow dbt-postgres && tail -f /dev/null"
    restart: unless-stopped

  dbt:
    image: python:3.11-slim
    container_name: dbt_env
    working_dir: /workspace/dbt/inep_dbt
    volumes:
      - .:/workspace
    environment:
      DBT_PROFILES_DIR: /workspace/dbt
    command: >
      sh -c "pip install --no-cache-dir dbt-postgres psycopg2-binary && tail -f /dev/null"
    depends_on:
      - postgres
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow_init
    depends_on:
      postgres:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Airflow's OWN metadata (DAG runs, task history, Variables, users)
      # lives in a dedicated "airflow" database — NOT ${POSTGRES_DB} (inep),
      # which is the warehouse (raw/staging/marts). They used to share one
      # database, which is why airflow-init used to DROP+CREATE it on every
      # startup: that was wiping the warehouse along with Airflow's own
      # state. See the idempotent bootstrap below instead.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_PROJECT_DIR: /opt/airflow/dbt/inep_dbt
      AIRFLOW_CONN_POSTGRES_INEP: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - .:/opt/airflow
    entrypoint: /bin/bash
    # Idempotent bootstrap: safe on a brand-new volume (creates the airflow
    # database, migrates, creates the admin user) AND safe to re-run against
    # an already-initialized one (creates nothing that already exists,
    # `airflow db migrate` is itself a safe no-op/upgrade). Never touches
    # ${POSTGRES_DB} (inep) — that database is created once by the postgres
    # image itself (via its own POSTGRES_DB env var) and only ever written
    # to by the DAG/dbt from here on.
    command: >
      -c "pip install --no-cache-dir dbt-postgres psycopg2-binary &&
      export PGPASSWORD='${POSTGRES_PASSWORD}' &&
      (psql -h postgres -U ${POSTGRES_USER} -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'airflow'\" | grep -q 1 ||
      psql -h postgres -U ${POSTGRES_USER} -d postgres -c \"CREATE DATABASE airflow;\") &&
      airflow db migrate &&
      (airflow users list | grep -q admin || airflow users create --username admin --firstname Airflow --lastname Admin --role Admin --email admin@example.com --password admin)"
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow_webserver
    depends_on:
      postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Airflow's own metadata DB — see the comment on airflow-init. NOT
      # ${POSTGRES_DB} (inep), which is the warehouse.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_PROJECT_DIR: /opt/airflow/dbt/inep_dbt
      AIRFLOW_CONN_POSTGRES_INEP: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - .:/opt/airflow
    ports:
      - "8080:8080"
    entrypoint: /bin/bash
    command: >
      -c "pip install --no-cache-dir dbt-postgres psycopg2-binary && airflow webserver"
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow_scheduler
    depends_on:
      postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Airflow's own metadata DB — see the comment on airflow-init. NOT
      # ${POSTGRES_DB} (inep), which is the warehouse.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_PROJECT_DIR: /opt/airflow/dbt/inep_dbt
      AIRFLOW_CONN_POSTGRES_INEP: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - .:/opt/airflow
    entrypoint: /bin/bash
    command: >
      -c "pip install --no-cache-dir dbt-postgres psycopg2-binary && airflow scheduler"
    restart: unless-stopped

volumes:
  postgres_data:
